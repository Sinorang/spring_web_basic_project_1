<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{/base}">
    <div th:fragment="content">
        <div class="playlist-header">
            <h1>플리 목록</h1>
            <p class="text-muted">다른 사용자들의 플리를 둘러보세요</p>
            <a href="/playlist/create" class="btn create-btn">
                <i class="fas fa-plus me-2"></i>새 플리 만들기
            </a>
        </div>
        <div class="row" th:if="${playlists != null and !playlists.empty}">
            <div class="col-md-6 col-lg-4" th:each="playlist : ${playlists}">
                <div class="card playlist-card">
                    <img th:if="${playlist.coverImageUrl != null}" th:src="${playlist.coverImageUrl}" class="card-img-top playlist-cover" alt="플리 커버">
                    <div class="card-img-top playlist-cover d-flex align-items-center justify-content-center bg-light" th:if="${playlist.coverImageUrl == null}">
                        <i class="fas fa-music fa-3x text-muted"></i>
                    </div>
                    <div class="card-body playlist-info">
                        <h5 class="playlist-title" th:text="${playlist.title}">플리 제목</h5>
                        <div class="playlist-meta">
                            <p class="mb-1"><i class="fas fa-music me-2"></i><span th:text="${playlist.songs.size()}">0</span>곡</p>
                            <p class="mb-1"><i class="fas fa-calendar me-2"></i><span th:text="${#temporals.format(playlist.createdAt, 'yyyy-MM-dd')}">생성일</span></p>
                            <p class="mb-3"><i class="fas fa-user me-2"></i><span th:text="${playlist.owner.nickname}">사용자</span></p>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{'/playlist/' + ${playlist.id}}" class="btn btn-outline-primary btn-sm"><i class="fas fa-eye me-1"></i>보기</a>
                            <button class="btn btn-outline-danger btn-sm delete-btn" th:data-playlist-id="${playlist.id}" th:if="${playlist.owner.id == #authentication.principal.id}"><i class="fas fa-trash me-1"></i>삭제</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="empty-state" th:if="${playlists == null or playlists.empty}">
            <i class="fas fa-music"></i>
            <h3>플리가 없습니다</h3>
            <p>아직 등록된 플리가 없습니다.</p>
            <a href="/playlist/create" class="btn create-btn"><i class="fas fa-plus me-2"></i>첫 번째 플리 만들기</a>
        </div>
        <script>
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const playlistId = this.getAttribute('data-playlist-id');
                    if (confirm('정말로 이 플리를 삭제하시겠습니까?')) {
                        fetch(`/api/playlist/${playlistId}`, {method: 'DELETE'})
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                location.reload();
                            } else {
                                alert('삭제 실패: ' + data.message);
                            }
                        })
                        .catch(error => {
                            alert('삭제 중 오류가 발생했습니다.');
                        });
                    }
                });
            });
        </script>
    </div>
</div>
</html>

<div th:replace="~{/base}">
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/playlist/list" class="btn back-btn">
                <i class="fas fa-arrow-left me-2"></i>목록으로 돌아가기
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" id="playlistPlayBtn">
                    <i class="fas fa-play"></i> 전체 재생
                </button>
                <a th:href="${playlist.originalUrl}" target="_blank" class="btn btn-outline-primary" th:if="${playlist.originalUrl != null}">
                    <i class="fas fa-external-link-alt"></i> YouTube 이동
                </a>
            </div>
        </div>
        <div class="playlist-header">
            <div class="playlist-header-content text-center">
                <img th:if="${playlist.coverImageUrl != null}" th:src="${playlist.coverImageUrl}" class="playlist-cover" alt="플리 커버">
                <div class="playlist-cover d-flex align-items-center justify-content-center bg-light mx-auto" th:if="${playlist.coverImageUrl == null}" style="width: 150px; height: 150px; border-radius: 10px;">
                    <i class="fas fa-music fa-3x text-muted"></i>
                </div>
                <h1 class="playlist-title" th:text="${playlist.title}">플리 제목</h1>
                <div class="playlist-meta">
                    <p class="mb-1"><i class="fas fa-music me-2"></i><span th:text="${playlist.songs.size()}">0</span>곡</p>
                    <p class="mb-1"><i class="fas fa-user me-2"></i><span th:text="${playlist.owner.nickname}">사용자</span></p>
                    <p class="mb-0"><i class="fas fa-calendar me-2"></i><span th:text="${#temporals.format(playlist.createdAt, 'yyyy년 MM월 dd일')}">생성일</span></p>
                </div>
            </div>
        </div>
        <div class="song-list" th:if="${playlist.songs != null and !playlist.songs.empty}">
            <div class="song-item play-song" th:each="song, status : ${playlist.songs}"
                 th:data-video-id="${song.youtubeVideoId}"
                 th:data-title="${song.title}"
                 th:data-artist="${song.artist}">
                <span class="song-order" th:text="${status.count}">1</span>
                <img th:if="${song.thumbnailUrl != null}" th:src="${song.thumbnailUrl}" class="song-thumbnail" alt="곡 썸네일">
                <div class="song-thumbnail d-flex align-items-center justify-content-center bg-light" th:if="${song.thumbnailUrl == null}">
                    <i class="fas fa-music text-muted"></i>
                </div>
                <div class="song-info">
                    <div class="song-title" th:text="${song.title}">곡 제목</div>
                    <div class="song-artist" th:text="${song.artist}">아티스트</div>
                </div>
            </div>
        </div>
        <div class="text-center py-5" th:if="${playlist.songs == null or playlist.songs.empty}">
            <i class="fas fa-music fa-3x text-muted mb-3"></i>
            <h3>곡이 없습니다</h3>
            <p class="text-muted">이 플리에는 곡이 포함되어 있지 않습니다.</p>
        </div>

        <!-- 곡 개별 재생 모달 -->
        <div class="modal fade" id="songPlayModal" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalSongTitle">곡 재생</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <div class="song-info mb-3">
                  <h6 id="modalSongTitleText"></h6>
                  <p id="modalSongArtist" class="text-muted"></p>
                </div>
                <div class="video-container">
                  <iframe id="songVideoPlayer" width="100%" height="315" frameborder="0" allowfullscreen></iframe>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- 전체 재생 모달 -->
        <div class="modal fade" id="playlistPlayModal" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">플리 전체 재생</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <iframe id="playlistVideoPlayer" width="100%" height="400" frameborder="0" allowfullscreen></iframe>
              </div>
            </div>
          </div>
        </div>

        <script>
        // 개별 곡 재생
        document.querySelectorAll('.play-song').forEach(item => {
          item.addEventListener('click', function() {
            const videoId = this.getAttribute('data-video-id');
            const title = this.getAttribute('data-title');
            const artist = this.getAttribute('data-artist');
            document.getElementById('modalSongTitleText').textContent = title;
            document.getElementById('modalSongArtist').textContent = artist;
            document.getElementById('songVideoPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            new bootstrap.Modal(document.getElementById('songPlayModal')).show();
          });
        });
        document.getElementById('songPlayModal').addEventListener('hidden.bs.modal', function() {
          document.getElementById('songVideoPlayer').src = '';
        });
        // 전체 재생
        document.getElementById('playlistPlayBtn').addEventListener('click', function() {
          const playlistId = "[[${playlist.youtubePlaylistId}]]";
          document.getElementById('playlistVideoPlayer').src = `https://www.youtube.com/embed?listType=playlist&list=${playlistId}&autoplay=1`;
          new bootstrap.Modal(document.getElementById('playlistPlayModal')).show();
        });
        document.getElementById('playlistPlayModal').addEventListener('hidden.bs.modal', function() {
          document.getElementById('playlistVideoPlayer').src = '';
        });
        </script>
    </div>
</div>

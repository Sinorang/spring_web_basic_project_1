<div th:replace="~{/base}">
    <div th:fragment="content">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>플레이리스트 관리</h1>
                    <a href="/admin" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>대시보드로 돌아가기
                    </a>
                </div>

                <!-- 통계 정보 -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h5 class="card-title">전체 플레이리스트</h5>
                                <p class="card-text display-6" th:text="${#lists.size(playlists)}">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 플레이리스트 목록 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">전체 플레이리스트 목록</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>번호</th>
                                        <th>제목</th>
                                        <th>소유자</th>
                                        <th>곡 수</th>
                                        <th>생성일</th>
                                        <th>작업</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="playlist, stat : ${playlists}">
                                        <td th:text="${stat.count}">1</td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <img th:if="${playlist.coverImageUrl}" 
                                                     th:src="${playlist.coverImageUrl}" 
                                                     class="me-2" 
                                                     style="width: 40px; height: 40px; object-fit: cover;"
                                                     alt="플레이리스트 썸네일">
                                                <span th:text="${playlist.title}">플레이리스트 제목</span>
                                            </div>
                                        </td>
                                        <td th:text="${playlist.owner.nickname}">사용자</td>
                                        <td th:text="${#lists.size(playlist.songs)}">0</td>
                                        <td th:text="${#temporals.format(playlist.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <a th:href="@{/playlist/{id}(id=${playlist.id})}" 
                                                   class="btn btn-sm btn-outline-primary" 
                                                   target="_blank">
                                                    <i class="fas fa-eye"></i> 보기
                                                </a>
                                                <button type="button" 
                                                        class="btn btn-sm btn-outline-danger"
                                                        th:onclick="'deletePlaylist(' + ${playlist.id} + ')'">
                                                    <i class="fas fa-trash"></i> 삭제
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(playlists)}">
                                        <td colspan="6" class="text-center text-muted">
                                            등록된 플레이리스트가 없습니다.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 삭제 확인 모달 -->
            <div class="modal fade" id="deleteModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">플레이리스트 삭제 확인</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <p>정말로 이 플레이리스트를 삭제하시겠습니까?</p>
                            <p class="text-danger">이 작업은 되돌릴 수 없습니다.</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="button" class="btn btn-danger" id="confirmDelete">삭제</button>
                        </div>
                    </div>
                </div>
            </div>

            <script th:inline="javascript">
                let playlistIdToDelete = null;

                // 쿠키에서 JWT 토큰 가져오기
                function getCookie(name) {
                    const value = `; ${document.cookie}`;
                    const parts = value.split(`; ${name}=`);
                    if (parts.length === 2) return parts.pop().split(';').shift();
                    return null;
                }

                // JWT 토큰 갱신
                async function refreshJwtToken() {
                    try {
                        const response = await fetch('/api/auth/refresh', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            if (data.success) {
                                return getCookie('jwt_token');
                            }
                        }
                    } catch (error) {
                        console.error('Token 갱신 실패:', error);
                    }
                    return null;
                }

                function deletePlaylist(playlistId) {
                    playlistIdToDelete = playlistId;
                    const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
                    modal.show();
                }

                document.getElementById('confirmDelete').addEventListener('click', async function() {
                    if (playlistIdToDelete) {
                        // JWT 토큰 가져오기 및 갱신
                        let token = getCookie('jwt_token');
                        
                        if (!token) {
                            // 토큰이 없으면 갱신 시도
                            token = await refreshJwtToken();
                            if (!token) {
                                alert('로그인이 필요합니다. 다시 로그인해주세요.');
                                window.location.href = '/acc/login';
                                return;
                            }
                        }
                        
                        try {
                            const response = await fetch(`/api/admin/playlists/${playlistIdToDelete}`, {
                                method: 'DELETE',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}`
                                }
                            });
                            
                            if (response.ok) {
                                alert('플레이리스트가 성공적으로 삭제되었습니다.');
                                location.reload();
                            } else {
                                alert('플레이리스트 삭제에 실패했습니다.');
                            }
                        } catch (error) {
                            console.error('Error:', error);
                            alert('플레이리스트 삭제 중 오류가 발생했습니다.');
                        }
                    }
                    
                    const modal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
                    modal.hide();
                });
            </script>
        </div>
    </div>
</div>

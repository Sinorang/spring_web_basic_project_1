<div th:replace="~{/base}">
    <div th:fragment="content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>사용자 관리</h1>
                <a href="/admin" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>대시보드로 돌아가기
                </a>
            </div>

            <!-- 통계 정보 -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">전체 사용자</h5>
                            <p class="card-text display-6" id="totalUsers">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 사용자 목록 -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">전체 사용자 목록</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>번호</th>
                                    <th>아이디</th>
                                    <th>닉네임</th>
                                    <th>이메일</th>
                                    <th>상태</th>
                                    <th>관리자 여부</th>
                                    <th>가입일</th>
                                    <th>작업</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <!-- 사용자 목록이 여기에 동적으로 로드됩니다 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 사용자 상세 정보 모달 -->
        <div class="modal fade" id="userDetailModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">사용자 상세 정보</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="userDetailContent">
                        <!-- 사용자 상세 정보가 여기에 로드됩니다 -->
                    </div>
                    <div class="modal-footer">
                        <div id="userActionButtons" class="me-auto">
                            <!-- 상태 변경 버튼이 여기에 동적으로 추가됩니다 -->
                        </div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            // 쿠키에서 JWT 토큰 가져오기
            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
                return null;
            }

            // JWT 토큰 갱신
            async function refreshJwtToken() {
                try {
                    const response = await fetch('/api/auth/refresh', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            return getCookie('jwt_token');
                        }
                    }
                } catch (error) {
                    console.error('Token 갱신 실패:', error);
                }
                return null;
            }

            // 사용자 목록 로드
            async function loadUsers() {
                let token = getCookie('jwt_token');
                
                if (!token) {
                    token = await refreshJwtToken();
                    if (!token) {
                        alert('로그인이 필요합니다. 다시 로그인해주세요.');
                        window.location.href = '/acc/login';
                        return;
                    }
                }
                
                try {
                    const response = await fetch('/api/admin/user-management', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const users = await response.json();
                        displayUsers(users);
                        document.getElementById('totalUsers').textContent = users.length;
                    } else {
                        alert('사용자 목록을 불러오는데 실패했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('사용자 목록을 불러오는 중 오류가 발생했습니다.');
                }
            }

            // 현재 로그인한 사용자 정보
            let currentUser = null;

            // JWT 토큰에서 사용자 정보 추출
            function getCurrentUserFromToken() {
                const token = getCookie('jwt_token');
                if (!token) return null;
                
                try {
                    // JWT 토큰의 payload 부분을 디코딩
                    const payload = token.split('.')[1];
                    const decodedPayload = JSON.parse(atob(payload));
                    return {
                        id: decodedPayload.sub || decodedPayload.username,
                        roles: decodedPayload.roles || []
                    };
                } catch (error) {
                    console.error('JWT 토큰 디코딩 실패:', error);
                    return null;
                }
            }

            // 사용자 목록 표시
            function displayUsers(users) {
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';
                
                users.forEach((user, index) => {
                    const isCurrentUser = currentUser && currentUser.id === user.userId;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${user.userId}</td>
                        <td>${user.nickname}</td>
                        <td>${user.email}</td>
                        <td>
                            <span class="badge ${user.status === 'ACTIVE' ? 'bg-success' : user.status === 'SUSPENDED' ? 'bg-warning' : 'bg-danger'}">
                                ${user.status}
                            </span>
                        </td>
                        <td>
                            <span class="badge ${user.isAdmin ? 'bg-primary' : 'bg-secondary'}">
                                ${user.isAdmin ? '관리자' : '일반'}
                            </span>
                        </td>
                        <td>${new Date(user.joinDate).toLocaleDateString()}</td>
                        <td>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-sm btn-outline-primary" onclick="showUserDetail('${user.userId}')">
                                    <i class="fas fa-eye"></i> 상세보기
                                </button>
                                ${!isCurrentUser ? (user.status === 'ACTIVE' ? 
                                    `<button type="button" class="btn btn-sm btn-outline-warning" onclick="suspendUser('${user.userId}', '${user.nickname}')">
                                        <i class="fas fa-ban"></i> 정지
                                    </button>` : 
                                    `<button type="button" class="btn btn-sm btn-outline-success" onclick="activateUser('${user.userId}', '${user.nickname}')">
                                        <i class="fas fa-check"></i> 활성화
                                    </button>`
                                ) : '<span class="text-muted small">본인 계정</span>'}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            // 사용자 상세 정보 표시
            async function showUserDetail(userId) {
                let token = getCookie('jwt_token');
                
                if (!token) {
                    token = await refreshJwtToken();
                    if (!token) {
                        alert('로그인이 필요합니다. 다시 로그인해주세요.');
                        window.location.href = '/acc/login';
                        return;
                    }
                }
                
                try {
                    const response = await fetch(`/api/admin/user-management/${userId}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const user = await response.json();
                        displayUserDetail(user);
                        const modal = new bootstrap.Modal(document.getElementById('userDetailModal'));
                        modal.show();
                    } else {
                        alert('사용자 상세 정보를 불러오는데 실패했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('사용자 상세 정보를 불러오는 중 오류가 발생했습니다.');
                }
            }

            // 사용자 상세 정보 표시
            function displayUserDetail(user) {
                const content = document.getElementById('userDetailContent');
                content.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6>기본 정보</h6>
                            <table class="table table-borderless">
                                <tr><td><strong>아이디:</strong></td><td>${user.userId || user.id}</td></tr>
                                <tr><td><strong>닉네임:</strong></td><td>${user.nickname}</td></tr>
                                <tr><td><strong>이름:</strong></td><td>${user.name}</td></tr>
                                <tr><td><strong>이메일:</strong></td><td>${user.email}</td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6>계정 정보</h6>
                            <table class="table table-borderless">
                                <tr><td><strong>상태:</strong></td><td><span class="badge ${user.status === 'ACTIVE' ? 'bg-success' : user.status === 'SUSPENDED' ? 'bg-warning' : 'bg-danger'}">${user.status}</span></td></tr>
                                <tr><td><strong>관리자 여부:</strong></td><td><span class="badge ${user.isAdmin ? 'bg-primary' : 'bg-secondary'}">${user.isAdmin ? '관리자' : '일반'}</span></td></tr>
                                <tr><td><strong>가입일:</strong></td><td>${new Date(user.joinDate).toLocaleString()}</td></tr>
                                <tr><td><strong>활성화 여부:</strong></td><td><span class="badge ${user.active ? 'bg-success' : 'bg-danger'}">${user.active ? '활성' : '비활성'}</span></td></tr>
                            </table>
                        </div>
                    </div>
                    ${user.adminRole ? `
                    <div class="row mt-3">
                        <div class="col-12">
                            <h6>관리자 권한 정보</h6>
                            <table class="table table-borderless">
                                <tr><td><strong>역할:</strong></td><td>${user.adminRole.roleName}</td></tr>
                                <tr><td><strong>설명:</strong></td><td>${user.adminRole.description}</td></tr>
                                <tr><td><strong>권한 부여일:</strong></td><td>${user.adminGrantedAt ? new Date(user.adminGrantedAt).toLocaleString() : 'N/A'}</td></tr>
                                <tr><td><strong>권한 부여자:</strong></td><td>${user.adminGrantedBy || 'N/A'}</td></tr>
                            </table>
                        </div>
                    </div>
                    ` : ''}
                `;

                // 상태 변경 버튼 추가
                const actionButtons = document.getElementById('userActionButtons');
                const isCurrentUser = currentUser && currentUser.id === (user.userId || user.id);
                
                if (isCurrentUser) {
                    actionButtons.innerHTML = `
                        <span class="text-muted">본인 계정은 수정할 수 없습니다.</span>
                    `;
                } else if (user.status === 'ACTIVE') {
                    actionButtons.innerHTML = `
                        <button type="button" class="btn btn-warning" onclick="suspendUser('${user.userId || user.id}', '${user.nickname}')">
                            <i class="fas fa-ban me-2"></i>계정 정지
                        </button>
                    `;
                } else {
                    actionButtons.innerHTML = `
                        <button type="button" class="btn btn-success" onclick="activateUser('${user.userId || user.id}', '${user.nickname}')">
                            <i class="fas fa-check me-2"></i>계정 활성화
                        </button>
                    `;
                }
            }

            // 사용자 계정 정지
            async function suspendUser(userId, nickname) {
                if (!confirm(`정말로 '${nickname}' 사용자의 계정을 정지하시겠습니까?`)) {
                    return;
                }

                let token = getCookie('jwt_token');
                if (!token) {
                    token = await refreshJwtToken();
                    if (!token) {
                        alert('로그인이 필요합니다. 다시 로그인해주세요.');
                        window.location.href = '/acc/login';
                        return;
                    }
                }

                try {
                    const response = await fetch(`/api/admin/user-management/${userId}/suspend`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        alert(result.message);
                        // 모달 닫기
                        const modal = bootstrap.Modal.getInstance(document.getElementById('userDetailModal'));
                        if (modal) {
                            modal.hide();
                        }
                        // 사용자 목록 새로고침
                        loadUsers();
                    } else {
                        const error = await response.json();
                        alert(error.message || '계정 정지 중 오류가 발생했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('계정 정지 중 오류가 발생했습니다.');
                }
            }

            // 사용자 계정 활성화
            async function activateUser(userId, nickname) {
                if (!confirm(`정말로 '${nickname}' 사용자의 계정을 활성화하시겠습니까?`)) {
                    return;
                }

                let token = getCookie('jwt_token');
                if (!token) {
                    token = await refreshJwtToken();
                    if (!token) {
                        alert('로그인이 필요합니다. 다시 로그인해주세요.');
                        window.location.href = '/acc/login';
                        return;
                    }
                }

                try {
                    const response = await fetch(`/api/admin/user-management/${userId}/activate`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        const result = await response.json();
                        alert(result.message);
                        // 모달 닫기
                        const modal = bootstrap.Modal.getInstance(document.getElementById('userDetailModal'));
                        if (modal) {
                            modal.hide();
                        }
                        // 사용자 목록 새로고침
                        loadUsers();
                    } else {
                        const error = await response.json();
                        alert(error.message || '계정 활성화 중 오류가 발생했습니다.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('계정 활성화 중 오류가 발생했습니다.');
                }
            }

            // 페이지 로드 시 사용자 목록 로드
            document.addEventListener('DOMContentLoaded', function() {
                currentUser = getCurrentUserFromToken();
                loadUsers();
            });
        </script>
    </div>
</div>

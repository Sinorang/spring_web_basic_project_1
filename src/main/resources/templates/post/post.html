<div th:replace="~{/base}"> <!-- base.html을 상속 -->
    <div th:fragment="content">
    <div class="container my-5 mx-auto">
      <!-- Flash 메시지 표시 -->
      <div th:if="${message}" class="alert alert-info alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <a
        class="link link-offset-1 link-offset-2-hover text-sm fs-6 mb-2 d-block"
        style="transition: all 0.1s ease-in-out"
        th:href="@{/board/index/{boardIdx}(boardIdx=${post.board.idx})}"
        >&larr; 게시판으로 돌아가기</a
      >
      <div class="container border rounded p-4 position-relative">
        <div class="header mb-3">
          <h2 class="text-start" th:text="${post.title}">게시글 제목</h2>
          <div style="display: flex">
            <p>작성자 : </p>
            <p id="Author" th:text = "${post.user.getId()}"> </p>
          </div>
        </div>
        <p class="m-0" th:text="${post.content}">게시글 내용</p>
        <hr class="mt-4" />
        <h4 class="mb-3">
          댓글
          <small
            class="text-secondary"
            id="commentsCount"
            th:text="${comments.size()}"
            >0</small
          >
        </h4>
        <div
          class="container p-0 d-flex flex-column align-items-start gap-2"
          th:unless="${#lists.isEmpty(comments)}"
        >
          <div
            class="comment border rounded p-3 w-100"
            th:each="comment : ${comments}"
          >
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <strong th:text="${comment.user.nickname}">작성자</strong>
                <small class="text-muted ms-2" th:text="${#temporals.format(comment.commentDate, 'yyyy-MM-dd HH:mm')}">작성일</small>
              </div>
              <div class="btn-group" role="group">
                <button
                  type="button"
                  class="btn btn-sm btn-outline-primary"
                  th:onclick="'editComment(' + ${comment.commentId} + ')'"
                >
                  수정
                </button>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-danger"
                  th:onclick="'deleteComment(' + ${comment.commentId} + ')'"
                >
                  삭제
                </button>
              </div>
            </div>
            <p class="mb-0 mt-2" th:text="${comment.commentContent}">댓글 내용</p>
          </div>
        </div>
        <div th:if="${#lists.isEmpty(comments)}" class="text-center text-muted">
          <p>아직 댓글이 없습니다.</p>
        </div>
        <hr class="mt-4" />
        <form th:action="@{/comment/create}" method="post">
          <input type="hidden" name="postId" th:value="${post.id}" />
          <div class="mb-3">
            <label for="commentContent" class="form-label">댓글 작성</label>
            <textarea
              class="form-control"
              id="commentContent"
              name="commentContent"
              rows="3"
              placeholder="댓글을 입력하세요"
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary">댓글 작성</button>
        </form>
      </div>
    </div>
    </div>
</div>
